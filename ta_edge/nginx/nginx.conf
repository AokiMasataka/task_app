worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # gzip（静的UI向け）
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    upstream login_ui {
        server ta-webui-login:80;
    }

    upstream service_ui {
        server ta-webui-service:80;
    }

    upstream gateway {
        server ta-gateway:80;
    }

    server {
        listen 80;
        server_name _;

        # ------------------------
        # Login UI
        # ------------------------
        location /login/ {
            proxy_pass http://login_ui/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SPA fallback
            proxy_intercept_errors on;
            error_page 404 = /login/index.html;
        }

        # ------------------------
        # Service UI
        # ------------------------
        location /app/ {
            proxy_http_version 1.1;

            proxy_pass http://service_ui/;
            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SPA fallback
            proxy_intercept_errors on;
            error_page 404 = /app/index.html;
        }

        # ------------------------
        # API Gateway
        # ------------------------
        location /api/ {
            proxy_pass http://gateway/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / SSE 対応
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300;
        }

        # ------------------------
        # ルートアクセス制御
        # ------------------------
        location = / {
            return 302 /app/;
        }
    }
}