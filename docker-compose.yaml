services:
  ta-edge:
    build:
      context: ta_edge
      dockerfile: Dockerfile
    image: ta-edge:latest
    container_name: ta-edge
    ports:
      - 80:80
      - 443:443
    depends_on:
      - ta-gateway
      - ta-webui-login
      - ta-webui-service

  ta-webui-login:
    build:
      context: easy_auther/webui/ea_webui_login
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL}
    image: ta-webui-login:latest
    container_name: ta-webui-login

  ta-webui-service:
    build:
      context: ta_front
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL}
    image: ta-webui-service:latest
    container_name: ta-webui-service
  
  ta-gateway:
    build:
      context: ta_gateway
      dockerfile: Dockerfile
    image: ta-gateway:latest
    container_name: ta-gateway
    ports:
      - 8080:80
    environment:
      APP_PORT: 80
      USER_AUTH_SERVICE_URL: "http://ta-user-auth"
      # PROJECT_SERVICE_URL: "http://ta-project-service:80"
      PROJECT_SERVICE_URL: "http://172.17.0.1:8000"

  ta-user-auth:
    build:
      context: easy_auther/ea_backend
      dockerfile: Dockerfile
    image: ta-user-auth:latest
    container_name: ta-user-auth
    depends_on:
      - ta-postgres
    environment:
      APP_PORT: 80
      PGSQL_HOST: ta-postgres
      PGSQL_PORT: ${POSTGRES_PORT}
      PGSQL_USER: ${POSTGRES_USER}
      PGSQL_PASS: ${POSTGRES_PASSWORD}
      PGSQL_DB: ${POSTGRES_DB}
      ALLOWED_ORIGINS: http://localhost:80,http://localhost:443,http://localhost:3000
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
    ports:
      - 8001:80

  ta-project-service:
    build:
      context: ta_project_service
      dockerfile: Dockerfile
    image: ta-project-service:latest
    container_name: ta-project-service
    environment:
      APP_PORT: 80
      POSTGRES_HOST: ta-postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - ta-postgres

  ta-postgres:
    image: postgres:17.2-alpine3.21
    container_name: ta-postgres
    ports:
      - ${POSTGRES_PORT}:5432
      #volumes:
      #  - ./postgresql/db_store:/var/lib/postgresql/data
      #  - ./postgresql/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      retries: 5
