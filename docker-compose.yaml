services:
  frnotend:
    build:
      context: task_app_front
      args:
        VITE_BACKEND_HOST: ${BACKEND_HOST}
        VITE_BACKEND_PORT: ${BACKEND_PORT}
        VITE_BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL}
    container_name: task-app-front
    ports:
      - 80:80
      - 443:443
    environment:
      - BACKEND_HOST=${BACKEND_HOST}
      - BACKEND_PORT=${BACKEND_PORT}


  backend:
    build: task_app_back
    container_name: task-app-back
    ports:
      - 8050:8000
    depends_on:
      - db
    environment:
      - PGSQL_HOST=task-app-postgres
      - PGSQL_PORT=${PGSQL_PORT}
      - PGSQL_USER=${PGSQL_USER}
      - PGSQL_PASS=${PGSQL_PASS}
      - PGSQL_DB=${PGSQL_DB}

  # flyway-baseline:
  #   <<: *flyway-template
  #   command: baseline -baselineVersion=1.0.0
  #   depends_on:
  #     db:
  #       condition: service_healthy

  # flyway-migrate:
  #   <<: *flyway-template
  #   command: migrate
  #   depends_on:
  #     flyway-baseline:
  #       condition: service_completed_successfully

  # flyway-info:
  #   <<: *flyway-template
  #   command: info

  db:
    image: postgres:17.2-alpine3.21
    container_name: task-app-postgres
    # ports:
    #   - ${PGSQL_PORT}:5432
    volumes:
      - ./postgresql/db_store:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=${PGSQL_USER}
      - POSTGRES_PASSWORD=${PGSQL_PASS}
      - POSTGRES_DB=${PGSQL_DB}
