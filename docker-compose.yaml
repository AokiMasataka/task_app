x-template: &flyway-template
  image: flyway/flyway:latest
  volumes:
    - ./postgresql/sql:/flyway/sql
  depends_on:
    db:
      condition: service_healthy
  environment:
    - FLYWAY_URL=jdbc:postgresql://task-app-postgres:${PGSQL_PORT}/${PGSQL_NAME}
    - FLYWAY_USER=${PGSQL_USER}
    - FLYWAY_PASSWORD=${PGSQL_PASS}
    - FLYWAY_LOCATIONS=filesystem:/flyway/sql
    - FLYWAY_CLEAN_DISABLED=false

services:
  frnotend:
    build: task_app_front
    container_name: task-app-front
    ports:
      - 80:80
      - 443:443

  backend:
    build: task_app_back
    container_name: task-app-back
    ports:
      - 8000:8000
    depends_on:
      - db
    environment:
      - PGSQL_HOST=task-app-postgres
      - PGSQL_USER=${PGSQL_USER}
      - PGSQL_PORT=${PGSQL_PORT}
      - PGSQL_NAME=${PGSQL_NAME}
      - PGSQL_PASS=${PGSQL_PASS}

  flyway-baseline:
    <<: *flyway-template
    command: baseline -baselineVersion=1.0.0
    depends_on:
      db:
        condition: service_healthy

  flyway-migrate:
    <<: *flyway-template
    command: migrate
    depends_on:
      flyway-baseline:
        condition: service_completed_successfully

  flyway-info:
    <<: *flyway-template
    command: info

  db:
    image: postgres:17.2-alpine3.21
    container_name: task-app-postgres
    ports:
      - 5432:5432
    volumes:
      - ./postgresql/db_store:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=${PGSQL_USER}
      - POSTGRES_PASSWORD=${PGSQL_PASS}
      - POSTGRES_DB=${PGSQL_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGSQL_USER}"]
      interval: 2s
      retries: 5
